<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lentera Bali - Splash Screen</title>
    <style>
        /* Reset Dasar & Layout Mobile Frame */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-user-select: none; /* Mencegah seleksi teks di mobile */
            user-select: none;
        }

        body {
            background-color: #0b1325; /* Warna latar belakang gelap malam */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Simulasi Aspek Rasio Layar Smartphone (9:16) */
        .mobile-container {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 892px;
            background: linear-gradient(180deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
        }

        /* Dekorasi Awan/Estetika Tradisional di Sisi Atas & Bawah */
        .decor-top {
            position: absolute;
            top: 0;
            width: 100%;
            height: 80px;
            background: linear-gradient(180deg, rgba(212, 163, 89, 0.2) 0%, transparent 100%);
            border-top: 4px solid #d4a359; /* Aksen Emas Bali */
        }

        /* Konten Logo Instansi & OPSI */
        .institution-logos {
            display: flex;
            gap: 20px;
            align-items: center;
            opacity: 0;
            animation: fadeIn 1.2s ease-out forwards;
            animation-delay: 0.3s;
            z-index: 2;
        }

        .logo-placeholder {
            width: 50px;
            height: 50px;
            background-color: rgba(255, 255, 255, 0.15);
            border: 2px solid #e63946; /* Aksen Merah */
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            font-size: 10px;
            font-weight: bold;
            text-align: center;
        }

        /* Konten Utama (Judul & Lentera Animasi) */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            z-index: 2;
        }

        /* Efek Lentera Bersinar */
        .lantern-container {
            position: relative;
            width: 120px;
            height: 120px;
            animation: float 3s ease-in-out infinite;
        }

        .lantern-glow {
            position: absolute;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255,215,0,0.6) 0%, rgba(255,140,0,0) 70%);
            top: 10px;
            left: 10px;
            border-radius: 50%;
            animation: pulse 1.5s ease-in-out infinite alternate;
        }

        .lantern-icon {
            position: absolute;
            width: 80px;
            height: 80px;
            background-color: #d4a359;
            border: 4px solid #e63946;
            border-radius: 20px;
            top: 20px;
            left: 20px;
            transform: rotate(45deg);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Simbol Lentera di dalam Kotak Rotasi */
        .lantern-icon::before {
            content: "🏮";
            font-size: 35px;
            transform: rotate(-45deg);
        }

        /* Tipografi Judul Game */
        .game-title {
            text-align: center;
            opacity: 0;
            animation: fadeIn 1.2s ease-out forwards;
            animation-delay: 0.6s;
        }

        .game-title h1 {
            font-size: 28px;
            color: #e5b842;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 4px 8px rgba(0, 0, 0, 0.6), 0 0 10px rgba(229, 184, 66, 0.4);
        }

        .game-title p {
            font-size: 13px;
            color: #f1faee;
            margin-top: 5px;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        /* Bagian Loading Bar di Bawah */
        .footer-content {
            width: 80%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            z-index: 2;
        }

        .loading-text {
            color: #f1faee;
            font-size: 12px;
            letter-spacing: 1px;
            animation: blink 1.5s infinite;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(212, 163, 89, 0.3);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #e63946, #d4a359);
            border-radius: 10px;
            box-shadow: 0 0 8px #d4a359;
            transition: width 0.1s linear;
        }

        .version-text {
            color: rgba(255, 255, 255, 0.4);
            font-size: 10px;
            margin-top: 10px;
        }

        /* Animasi Keyframes */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1.2); opacity: 0.9; }
        }

        @keyframes blink {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        /* Transisi Halaman Keluar */
        .fade-out-active {
            transition: opacity 0.6s ease-out;
            opacity: 0 !important;
        }
    </style>
</head>
<body>

    <div class="mobile-container" id="splashScreen">
        <div class="decor-top"></div>

        <div class="institution-logos">
            <div class="logo-placeholder">LOGO<br>SEKOLAH</div>
            <div class="logo-placeholder" style="border-color: #d4a359;">LOGO<br>OPSI</div>
        </div>

        <div class="main-content">
            <div class="lantern-container">
                <div class="lantern-glow"></div>
                <div class="lantern-icon"></div>
            </div>
            <div class="game-title">
                <h1>Lentera Bali</h1>
                <p>Edugame Tri Hita Karana</p>
            </div>
        </div>

        <div class="footer-content">
            <div class="loading-text" id="loadingLabel">Memuat Data Game...</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="version-text">v1.0.0 - Beta Version</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const progressBar = document.getElementById("progressBar");
            const loadingLabel = document.getElementById("loadingLabel");
            const splashScreen = document.getElementById("splashScreen");
            
            let progress = 0;
            
            // Simulasi teks loading game mobile agar terasa realistik
            const loadingPhrases = [
                "Memuat Data Game...",
                "Menyiapkan Aset AR...",
                "Menyusun Kuis Tri Hita Karana...",
                "Hampir Selesai..."
            ];

            // Interval update progress bar (total waktu sekitar 3.5 detik)
            const loadingInterval = setInterval(() => {
                progress += 1;
                progressBar.style.width = `${progress}%`;

                // Mengubah teks petunjuk di atas loading bar berdasarkan persentase
                if (progress === 25) {
                    loadingLabel.innerText = loadingPhrases[1];
                } else if (progress === 55) {
                    loadingLabel.innerText = loadingPhrases[2];
                } else if (progress === 85) {
                    loadingLabel.innerText = loadingPhrases[3];
                }

                // Jika loading bar penuh (100%)
                if (progress >= 100) {
                    clearInterval(loadingInterval);
                    loadingLabel.innerText = "Memulai Petualangan!";
                    
                    // Efek transisi fade out sebelum pindah halaman
                    setTimeout(() => {
                        splashScreen.classList.add("fade-out-active");
                        
                        // Eksekusi perpindahan ke halaman login.html setelah animasi selesai
                        setTimeout(() => {
                            window.location.href = "login.html";
                        }, 600); 

                    }, 400);
                }
            }, 35); // Kecepatan peningkatan progress (35ms * 100 langkah = 3.5 detik)
        });
    </script>
</body>
</html>
