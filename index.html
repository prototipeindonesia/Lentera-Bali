<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lentera Bali - Splash Screen</title>
    <style>
        /* Reset Dasar & Layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #0b1325;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Kontainer Responsif Menggunakan bgawal.jpg */
        .splash-container {
            width: 100%;
            height: 100vh;
            /* Menggunakan bgawal.jpg dengan overlay gradient malam gelap */
            background: linear-gradient(180deg, rgba(11, 19, 37, 0.5) 0%, rgba(11, 19, 37, 0.85) 100%), 
                        url('bgawal.jpg') no-repeat center center;
            background-size: cover;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 60px 24px;
            cursor: pointer; /* Memberi petunjuk visual bahwa layar bisa disentuh */
        }

        /* Pembatas Layar Desktop (Tablet & Mobile tetap Full Screen) */
        @media (min-width: 1025px) {
            .splash-container {
                max-width: 450px;
                max-height: 920px;
                border-radius: 20px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            }
        }

        /* Dekorasi Bingkai Emas Atas khas Bali */
        .decor-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 90px;
            background: linear-gradient(180deg, rgba(212, 163, 89, 0.25) 0%, transparent 100%);
            border-top: 6px solid #d4a359;
            z-index: 2;
        }

        /* Konten Utama */
        .main-content {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            z-index: 3;
            width: 100%;
            margin-top: 20px;
        }

        /* Ukuran Logo Diperbesar & Animasi Bergerak Lebih Hidup */
        .logo-container {
            position: relative;
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            /* Gabungan animasi mengapung dan rotasi halus */
            animation: float-large 4s ease-in-out infinite, shimmer-rotate 8s linear infinite;
        }

        /* Efek Kilau Aura Emas di Belakang Logo */
        .logo-glow {
            position: absolute;
            width: 190px;
            height: 190px;
            background: radial-gradient(circle, rgba(242, 187, 89, 0.65) 0%, rgba(230, 57, 70, 0) 70%);
            border-radius: 50%;
            animation: pulse-glow 2s ease-in-out infinite alternate;
            z-index: 1;
        }

        /* Gambar Logo Utama */
        .game-logo {
            width: 250px;
            height: 250px;
            object-fit: contain;
            z-index: 4;
            filter: drop-shadow(0 6px 20px rgba(212, 163, 89, 0.7));
        }

        /* Tipografi Judul Game */
        .game-title {
            text-align: center;
            opacity: 0;
            animation: fadeIn 1.2s ease-out forwards;
            animation-delay: 0.5s;
            background: rgba(11, 19, 37, 0.75);
            padding: 16px 32px;
            border-radius: 16px;
            border: 1px solid rgba(212, 163, 89, 0.3);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            max-width: 90%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .game-title h1 {
            font-size: 34px;
            color: #e5b842;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 4px 10px rgba(0, 0, 0, 0.9), 0 0 15px rgba(229, 184, 66, 0.6);
        }

        .game-title p {
            font-size: 14px;
            color: #f1faee;
            margin-top: 6px;
            letter-spacing: 1.5px;
            opacity: 0.95;
            font-weight: 500;
        }

        /* Bagian Proses Pemuatan (Loading) */
        .footer-content {
            width: 85%;
            max-width: 350px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            z-index: 3;
            background: rgba(11, 19, 37, 0.8);
            padding: 20px;
            border-radius: 16px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        .loading-text {
            color: #f1faee;
            font-size: 13px;
            letter-spacing: 1px;
            font-weight: 600;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            animation: blink 1.5s infinite;
            text-align: center;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(212, 163, 89, 0.4);
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #e63946, #d4a359);
            border-radius: 10px;
            box-shadow: 0 0 14px #d4a359;
            transition: width 0.1s linear;
        }

        .version-text {
            color: rgba(255, 255, 255, 0.45);
            font-size: 10px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        /* Kumpulan Animasi Keyframes */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes float-large {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-15px); }
            100% { transform: translateY(0px); }
        }

        @keyframes shimmer-rotate {
            0% { rotate: 0deg; }
            25% { rotate: 3deg; }
            75% { rotate: -3deg; }
            100% { rotate: 0deg; }
        }

        @keyframes pulse-glow {
            0% { transform: scale(0.9); opacity: 0.5; }
            100% { transform: scale(1.12); opacity: 0.9; }
        }

        @keyframes blink {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Transisi Keluar Halaman */
        .fade-out-active {
            transition: opacity 0.7s ease-out;
            opacity: 0 !important;
        }
    </style>
</head>
<body>

    <div class="splash-container" id="splashScreen">
        <div class="decor-top"></div>

        <div class="main-content">
            <div class="logo-container">
                <div class="logo-glow"></div>
                <img src="logogame.png" alt="Lentera Bali Logo" class="game-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
                
                <div style="display:none; width:110px; height:110px; background:#d4a359; border:5px solid #e63946; border-radius:25px; transform:rotate(45deg); justify-content:center; align-items:center; color:#fff; font-size:45px; z-index: 4;"><span style="transform:rotate(-45deg);">🏮</span></div>
            </div>
            
            <div class="game-title">
                <h1>Lentera Bali</h1>
                <p>Edugame Tri Hita Karana</p>
            </div>
        </div>

        <div class="footer-content">
            <div class="loading-text" id="loadingLabel">Memuat Data Game...</div>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="version-text">v1.0.0 - Beta Version</div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const progressBar = document.getElementById("progressBar");
            const loadingLabel = document.getElementById("loadingLabel");
            const splashScreen = document.getElementById("splashScreen");
            
            // Inisialisasi Audio Backsound
            const bgm = new Audio('backsound.mp3');
            bgm.loop = true;
            bgm.volume = 0.7; // Atur volume (0.0 sampai 1.0)

            // Fungsi pengaktifan audio aman (Bypass Kebijakan Autoplay Browser)
            function playBGM() {
                bgm.play().then(() => {
                    // Audio berhasil diputar, hapus event listener agar efisien
                    document.removeEventListener('click', playBGM);
                    document.removeEventListener('touchstart', playBGM);
                }).catch(error => {
                    console.log("Autoplay dicegah oleh browser, menunggu interaksi pengguna.");
                });
            }

            // Coba putar otomatis langsung
            playBGM();

            // Fallback: Jika diblokir, mainkan begitu pengguna menyentuh/mengklik area splashscreen
            document.addEventListener('click', playBGM);
            document.addEventListener('touchstart', playBGM);

            let progress = 0;
            const loadingPhrases = [
                "Memuat Data Game...",
                "Menyiapkan Aset Kebudayaan...",
                "Menyusun Kuis Tri Hita Karana...",
                "Menyelaraskan Harmoni...",
                "Hampir Selesai..."
            ];

            // Interval pengisian loading bar selama total ~5 detik
            const loadingInterval = setInterval(() => {
                progress += 1;
                progressBar.style.width = `${progress}%`;

                // Pergantian teks informasi berkala
                if (progress === 20) {
                    loadingLabel.innerText = loadingPhrases[1];
                } else if (progress === 45) {
                    loadingLabel.innerText = loadingPhrases[2];
                } else if (progress === 70) {
                    loadingLabel.innerText = loadingPhrases[3];
                } else if (progress === 90) {
                    loadingLabel.innerText = loadingPhrases[4];
                }

                // Selesai memuat
                if (progress >= 100) {
                    clearInterval(loadingInterval);
                    loadingLabel.innerText = "Memulai Petualangan!";
                    
                    setTimeout(() => {
                        splashScreen.classList.add("fade-out-active");
                        
                        // Hentikan audio secara perlahan atau matikan saat ganti dokumen
                        setTimeout(() => {
                            bgm.pause();
                            window.location.href = "login.html";
                        }, 700); 

                    }, 500);
                }
            }, 50); 
        });
    </script>
</body>
</html>
