<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lentera Bali - Masuk Game</title>
    <style>
        /* Reset Dasar & Layout Mobile Frame */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #0b1325;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Tampilan Mobile 9:16 + Integrasi Background Baru */
        .mobile-container {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 892px;
            /* Memasang background-splash.png dengan fallback linear gradient */
            background: linear-gradient(180deg, rgba(13, 27, 42, 0.4) 0%, rgba(11, 19, 37, 0.75) 100%), 
                        url('Background-splash.png') no-repeat center center;
            background-size: cover;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            opacity: 0;
            animation: fadeInPage 0.6s ease-out forwards;
        }

        /* Ornamen Bingkai Tradisional (Top & Bottom) */
        .decor-border-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: linear-gradient(90deg, #e63946, #d4a359, #e63946);
            z-index: 2;
        }

        /* Bagian Atas / Header Kartu dengan Backplate Blur */
        .header-section {
            text-align: center;
            margin-top: 20px;
            width: 100%;
            z-index: 2;
            background: rgba(11, 19, 37, 0.6);
            padding: 12px 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
        }

        .mini-lantern {
            font-size: 32px;
            animation: swing 3s ease-in-out infinite;
            transform-origin: top center;
            display: inline-block;
            margin-bottom: 6px;
        }

        .header-section h2 {
            color: #e5b842;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .header-section p {
            color: #f1faee;
            font-size: 12px;
            opacity: 0.9;
            margin-top: 4px;
            font-weight: 500;
        }

        /* Form Card Center (Ditingkatkan kegelapan & blur demi kontras teks emas) */
        .form-container {
            width: 100%;
            background: rgba(13, 27, 42, 0.75);
            border: 2px solid rgba(212, 163, 89, 0.4);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            margin: auto 0;
            z-index: 2;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            color: #e5b842;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(11, 19, 37, 0.9);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            -webkit-user-select: text;
            user-select: text; /* Izinkan keyboard input mengetik */
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #d4a359;
            box-shadow: 0 0 10px rgba(212, 163, 89, 0.4);
            background: #0d1b2a;
        }

        /* Kustomisasi drop-down select option */
        .input-group select option {
            background-color: #111a2e;
            color: white;
        }

        /* Pesan Error Validasi */
        .error-message {
            color: #ff4d4d;
            font-size: 11px;
            margin-top: 5px;
            display: none;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* Tombol Main / Submit */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #e63946 0%, #b71c1c 100%);
            border: 2px solid #e5b842;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.5);
            transition: transform 0.1s ease, box-shadow 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:active {
            transform: scale(0.98);
            box-shadow: 0 2px 5px rgba(230, 57, 70, 0.2);
        }

        /* Bagian Footer */
        .footer-text {
            color: rgba(251, 252, 250, 0.7);
            font-weight: 500;
            font-size: 11px;
            text-align: center;
            width: 100%;
            z-index: 2;
            background: rgba(11, 19, 37, 0.6);
            padding: 8px;
            border-radius: 10px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Animasi */
        @keyframes fadeInPage {
            from { opacity: 0; transform: scale(1.02); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes swing {
            0% { transform: rotate(-5deg); }
            50% { transform: rotate(5deg); }
            100% { transform: rotate(-5deg); }
        }

        /* Transisi Keluar */
        .fade-out-active {
            transition: all 0.5s ease-in-out;
            opacity: 0 !important;
            transform: translateY(-20px) !important;
        }
    </style>
</head>
<body>

    <div class="mobile-container" id="loginPage">
        <div class="decor-border-top"></div>

        <div class="header-section">
            <div class="mini-lantern">🏮</div>
            <h2>Registrasi Siswa</h2>
            <p>Isi data diri untuk memulai penjelajahan</p>
        </div>

        <div class="form-container">
            <form id="studentForm" onsubmit="handleLogin(event)">
                
                <div class="input-group">
                    <label for="studentName">Nama Lengkap Siswa</label>
                    <input type="text" id="studentName" placeholder="Contoh: I Putu Dimas" autocomplete="off">
                    <div class="error-message" id="nameError">Nama wajib diisi untuk data penelitian!</div>
                </div>

                <div class="input-group">
                    <label for="studentClass">Kelas</label>
                    <select id="studentClass">
                        <option value="" disabled selected>Pilih Kelas...</option>
                        <option value="IV A">Kelas IV A</option>
                        <option value="IV B">Kelas IV B</option>
                        <option value="Lainnya">Kelas Lain (Uji Coba Eksternal)</option>
                    </select>
                    <div class="error-message" id="classError">Silakan pilih kelas terlebih dahulu!</div>
                </div>

                <button type="submit" class="btn-submit">Mulai Petualangan</button>
            </form>
        </div>

        <div class="footer-text">
            Penelitian OPSI 2026 - SMAN 4 Denpasar<br>
            Aplikasi Terenkripsi Berbasis Data Firebase
        </div>
    </div>

    <script>
        function handleLogin(event) {
            event.preventDefault();

            const nameInput = document.getElementById("studentName").value.trim();
            const classInput = document.getElementById("studentClass").value;
            
            const nameError = document.getElementById("nameError");
            const classError = document.getElementById("classError");
            const loginPage = document.getElementById("loginPage");

            let isValid = true;

            // Validasi Input Nama
            if (nameInput === "") {
                nameError.style.display = "block";
                isValid = false;
            } else {
                nameError.style.display = "none";
            }

            // Validasi Input Kelas
            if (classInput === "") {
                classError.style.display = "block";
                isValid = false;
            } else {
                classError.style.display = "none";
            }

            // Jika valid, simpan ke LocalStorage dan teruskan ke halaman instruksi Pre-Test
            if (isValid) {
                localStorage.setItem("siswa_nama", nameInput);
                localStorage.setItem("siswa_kelas", classInput);
                localStorage.setItem("progress_level", "1"); 

                // Animasi transisi keluar halaman
                loginPage.classList.add("fade-out-active");

                // Berpindah ke instruksi pre-test setelah animasi rampung
                setTimeout(() => {
                    window.location.href = "instruction-pretest.html"; 
                }, 500);
            }
        }
    </script>
</body>
</html>
