<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lentera Bali - Masuk Game</title>
    <style>
        /* Reset Dasar & Layout */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-user-select: none;
            user-select: none;
        }

        body {
            background-color: #0b1325;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Tampilan Responsif: Full Screen di Mobile & Tablet */
        .login-container {
            width: 100%;
            height: 100vh;
            /* Menggunakan bgawal.jpg dengan overlay gradient malam gelap */
            background: linear-gradient(180deg, rgba(11, 19, 37, 0.5) 0%, rgba(11, 19, 37, 0.85) 100%), 
                        url('bgawal.jpg') no-repeat center center;
            background-size: cover;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 40px 24px;
            opacity: 0;
            animation: fadeInPage 0.6s ease-out forwards;
        }

        /* Pembatas Layar Desktop (Tablet & Mobile tetap Full Screen) */
        @media (min-width: 1025px) {
            .login-container {
                max-width: 450px;
                max-height: 920px;
                border-radius: 20px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.7);
            }
        }

        /* Ornamen Bingkai Tradisional Atas */
        .decor-border-top {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 12px;
            background: linear-gradient(90deg, #e63946, #d4a359, #e63946);
            z-index: 2;
        }

        /* Bagian Atas / Header Kartu */
        .header-section {
            text-align: center;
            margin-top: 15px;
            width: 100%;
            z-index: 2;
            background: rgba(11, 19, 37, 0.65);
            padding: 16px;
            border-radius: 16px;
            border: 1px solid rgba(212, 163, 89, 0.25);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        /* Wadah Integrasi Gambar logogame.png */
        .logo-wrapper {
            position: relative;
            width: 75px;
            height: 75px;
            display: flex;
            justify-content: center;
            align-items: center;
            animation: float-mini 3s ease-in-out infinite;
        }

        .game-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 2px 8px rgba(212, 163, 89, 0.5));
        }

        .header-section h2 {
            color: #e5b842;
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
            margin-top: 4px;
        }

        .header-section p {
            color: #f1faee;
            font-size: 12px;
            opacity: 0.9;
            font-weight: 500;
        }

        /* Form Card Center */
        .form-container {
            width: 100%;
            max-width: 360px;
            background: rgba(13, 27, 42, 0.8);
            border: 2px solid rgba(212, 163, 89, 0.4);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            margin: auto 0;
            z-index: 2;
        }

        .input-group {
            margin-bottom: 20px;
            position: relative;
        }

        .input-group label {
            display: block;
            color: #e5b842;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
        }

        .input-group input, .input-group select {
            width: 100%;
            padding: 14px 16px;
            background: rgba(11, 19, 37, 0.9);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            -webkit-user-select: text;
            user-select: text;
        }

        .input-group input:focus, .input-group select:focus {
            border-color: #d4a359;
            box-shadow: 0 0 10px rgba(212, 163, 89, 0.4);
            background: #0d1b2a;
        }

        .input-group select option {
            background-color: #111a2e;
            color: white;
        }

        /* Pesan Error Validasi */
        .error-message {
            color: #ff4d4d;
            font-size: 11px;
            margin-top: 5px;
            display: none;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }

        /* Tombol Main / Submit */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #e63946 0%, #b71c1c 100%);
            border: 2px solid #e5b842;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(230, 57, 70, 0.5);
            transition: transform 0.1s ease, box-shadow 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:active {
            transform: scale(0.98);
            box-shadow: 0 2px 5px rgba(230, 57, 70, 0.2);
        }

        /* Bagian Footer */
        .footer-text {
            color: rgba(251, 252, 250, 0.75);
            font-weight: 500;
            font-size: 11px;
            text-align: center;
            width: 100%;
            max-width: 360px;
            z-index: 2;
            background: rgba(11, 19, 37, 0.7);
            padding: 10px;
            border-radius: 12px;
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }

        /* Kumpulan Animasi */
        @keyframes fadeInPage {
            from { opacity: 0; transform: scale(1.02); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes float-mini {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
            100% { transform: translateY(0px); }
        }

        /* Transisi Keluar */
        .fade-out-active {
            transition: all 0.5s ease-in-out;
            opacity: 0 !important;
            transform: translateY(-20px) !important;
        }
    </style>
</head>
<body>

    <div class="login-container" id="loginPage">
        <div class="decor-border-top"></div>

        <div class="header-section">
            <div class="logo-wrapper">
                <img src="logogame.png" alt="Logo Game" class="game-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='inline-block';">
                <span style="display:none; font-size:32px;">🏮</span>
            </div>
            <h2>Registrasi Siswa</h2>
            <p>Isi data diri untuk memulai penjelajahan</p>
        </div>

        <div class="form-container">
            <form id="studentForm" onsubmit="handleLogin(event)">
                
                <div class="input-group">
                    <label for="studentName">Nama Lengkap Siswa</label>
                    <input type="text" id="studentName" placeholder="Contoh: I Putu Dimas" autocomplete="off">
                    <div class="error-message" id="nameError">Nama wajib diisi untuk data penelitian!</div>
                </div>

                <div class="input-group">
                    <label for="studentClass">Kelas</label>
                    <select id="studentClass">
                        <option value="" disabled selected>Pilih Kelas...</option>
                        <option value="IV A">Kelas IV A</option>
                        <option value="IV B">Kelas IV B</option>
                        <option value="Lainnya">Kelas Lain (Uji Coba Eksternal)</option>
                    </select>
                    <div class="error-message" id="classError">Silakan pilih kelas terlebih dahulu!</div>
                </div>

                <button type="submit" class="btn-submit">Mulai Petualangan</button>
            </form>
        </div>

        <div class="footer-text">
            Penelitian OPSI 2026 - SMAN 4 Denpasar<br>
            Aplikasi Terenkripsi Berbasis Data Firebase
        </div>
    </div>

    <script>
        // Inisialisasi Backsound
        const bgm = new Audio('backsound.mp3');
        bgm.loop = true;
        bgm.volume = 0.6; // Atur kenyamanan intensitas volume musik latar

        function playBGM() {
            bgm.play().then(() => {
                // Lepaskan pendengar event agar tidak menumpuk panggilan fungsi saat interaksi lanjutan
                document.removeEventListener('click', playBGM);
                document.removeEventListener('touchstart', playBGM);
            }).catch(err => {
                console.log("Audio otomatis diblokir, menunggu interaksi pengguna pada form.");
            });
        }

        // Jalankan pelacakan interaksi aman sesegera mungkin
        playBGM();
        document.addEventListener('click', playBGM);
        document.addEventListener('touchstart', playBGM);

        function handleLogin(event) {
            event.preventDefault();

            const nameInput = document.getElementById("studentName").value.trim();
            const classInput = document.getElementById("studentClass").value;
            
            const nameError = document.getElementById("nameError");
            const classError = document.getElementById("classError");
            const loginPage = document.getElementById("loginPage");

            let isValid = true;

            // Validasi Input Nama
            if (nameInput === "") {
                nameError.style.display = "block";
                isValid = false;
            } else {
                nameError.style.display = "none";
            }

            // Validasi Input Kelas
            if (classInput === "") {
                classError.style.display = "block";
                isValid = false;
            } else {
                classError.style.display = "none";
            }

            // Jika valid, simpan ke LocalStorage dan teruskan ke halaman instruksi Pre-Test
            if (isValid) {
                localStorage.setItem("siswa_nama", nameInput);
                localStorage.setItem("siswa_kelas", classInput);
                localStorage.setItem("progress_level", "1"); 

                // Animasi transisi keluar halaman
                loginPage.classList.add("fade-out-active");

                // Efek Audio Fade Out (mengecilkan volume audio bertahap) sebelum berpindah halaman
                let fadeInterval = setInterval(() => {
                    if (bgm.volume > 0.05) {
                        bgm.volume -= 0.05;
                    } else {
                        clearInterval(fadeInterval);
                        bgm.pause();
                    }
                }, 40);

                // Berpindah ke instruksi pre-test setelah animasi rampung
                setTimeout(() => {
                    window.location.href = "instruction-pretest.html"; 
                }, 500);
            }
        }
    </script>
</body>
</html>
